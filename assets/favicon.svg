<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128">
    <foreignObject width="100%" height="100%">
        <div xmlns="http://www.w3.org/1999/xhtml" style="margin: 0px; padding: 0px; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;">

  <style>

    .logo {
      font-family: "Times New Roman", serif;
      font-size: 6rem;
      font-weight: normal;
      fill: #000000;
      letter-spacing: 0rem;
      line-height: 1;
	  display: flex;
	  padding-top: 10px;
    }

    .logo span {
      display: inline-block;
      animation-name: wobble;
      animation-duration: 1s;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
      animation-direction: alternate;
      animation-play-state: paused;
    }

    .logo span:nth-child(1) {
      animation-delay: -0.2s;
    }

    .logo span:nth-child(2) {
      animation-delay: -0.62s;
    }
	

    @media (prefers-color-scheme: dark) {
      .logo { fill: #ffffff; }
    }

    @keyframes wobble {
      0% {
        transform: rotate(-8deg) translateY(-0.06em);
      }

      50% {
        transform: rotate(12deg)
          translateY(0.08em)
          translateX(0.03em);
      }

      100% {
        transform: rotate(-14deg)
          translateY(-0.02em)
          translateX(-0.02em);
      }
    }
  </style>



  <div class="logo">
    <span>d</span><span>b</span>
  </div>

</div>
    </foreignObject>
</svg>
