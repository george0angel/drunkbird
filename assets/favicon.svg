<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 128 128"
  width="128"
  height="128"
>
  <style>
    .letter {
      fill: #000;
      font-family: "Times New Roman", Times, serif;
      font-size: 96px;
      font-weight: 400;
      transform-box: fill-box;
      transform-origin: center;
    }

    .d {
      transform:
        rotate(-3deg)
        translateY(-0.02em)
        translateX(0.01em);
    }

    .b {
      transform:
        rotate(8deg)
        translateY(0.12em)
        translateX(0.025em);
    }

    @media (prefers-color-scheme: dark) {
      .letter {
        fill: #fff;
      }
    }
  </style>

  <text
    class="letter d"
    x="40"
    y="94"
    text-anchor="middle"
  >d</text>

  <text
    class="letter b"
    x="88"
    y="94"
    text-anchor="middle"
  >b</text>
</svg>
